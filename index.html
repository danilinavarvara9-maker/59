try{saved={...saved,...JSON.parse(localStorage.getItem('morphophone-progress')||'{}')}}catch(e){}
const $=x=>document.getElementById(x), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rounds=[];
let tileCounter=0;
function persist(){try{localStorage.setItem('morphophone-progress',JSON.stringify(saved))}catch(e){}}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function clone(obj){return JSON.parse(JSON.stringify({...obj,drag:null}))}
function navigate(page,extra={}){trail.push(clone(state));future=[];state={...state,...extra,page};render()}
function back(){if(!trail.length)return;future.push(clone(state));state=trail.pop();render()}
function forward(){if(!future.length)return;trail.push(clone(state));state=future.pop();render()}
function home(){if(state.page!=='home')navigate('home')}
function showToast(text){const host=$('toastHost');host.innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>{host.innerHTML=''},1350)}
const levelWords=l=>WORDS.filter(w=>l===1?!w.p&&!w.s&&!!w.e:l===2?!!w.p&&!w.s&&!!w.e:!!w.p&&!!w.s&&!!w.e);
// A varied selection without repeating words from the same root when possible.
function variedPick(pool,count,usedRoots=new Set()){
  const result=[];
  const options=shuffle(pool);
  for(const word of options){
    if(result.length>=count) break;
    if(usedRoots.has(word.r)) continue;
    result.push(word);usedRoots.add(word.r);
  }
  for(const word of options){if(result.length>=count)break;if(!result.includes(word)){result.push(word);usedRoots.add(word.r)}}
  return result;
}
function levelRounds(l){
  if(l===1)return variedPick(levelWords(1),8);
  if(l===2)return variedPick(levelWords(2),8);
  const groups=[
    WORDS.filter(w=>!w.p&&!w.s&&w.e),
    WORDS.filter(w=>!!w.p&&!w.s),
    WORDS.filter(w=>!w.p&&!!w.s),
    WORDS.filter(w=>!!w.p&&!!w.s)
  ];
  const used=new Set();
  const selected=groups.flatMap(group=>variedPick(group,2,used));
  const extra=variedPick(WORDS.filter(w=>!selected.includes(w)&&w.e),2,used);
  return shuffle([...selected,...extra]);
}
const seq=w=>['p','r','s','e'].filter(x=>w[x] && (state.level===1?['r','e'].includes(x):state.level===2?['p','r','e'].includes(x):true));
function wordMarkup(w){return `<div class="word">${['p','r','s','e'].filter(k=>w[k]).map(k=>`<span class="part ${k}" title="${PARTS[k].name}">${esc(w[k])}</span>`).join('')}${!w.e?'<span style="font-size:18px;color:#ae62cf;margin-left:2px">□</span>':''}</div>`}
function legend(w){return `<div class="legend">${['p','r','s','e'].filter(k=>w[k]).map(k=>`<span style="color:${{p:'#df5b50',r:'#198755',s:'#327ac7',e:'#a550ca'}[k]}">${PARTS[k].name.toLowerCase()}: ${esc(w[k])}</span>`).join('')}${!w.e?'<span>нулевое окончание □</span>':''}</div>`}
function app(icon,name,a,b,action){return `<button class="app" data-action="${action}"><span class="appicon" style="--a:${a};--b:${b}">${icon}</span><span class="appname">${name}</span></button>`}
function head(emoji,title,subtitle,color){return `<div class="head" style="--head:${color}"><div class="glyph">${emoji}</div><div><h2>${title}</h2><div class="small">${subtitle}</div></div></div>`}
function pageHome(){return `<div class="homehero"><div class="hero-emoji">📱🌲</div><h1>МорфоФон</h1><div class="subtitle">Волшебный мир частей слова ✨</div><span class="pill">⭐ ${saved.stars} звёзд собрано</span></div><div class="appgrid">${app('🏠','Приставка','#5de19c','#19a770','topic:p')}${app('🌳','Корень','#ffd273','#f39131','topic:r')}${app('🌱','Суффикс','#99e8ff','#4a98f3','topic:s')}${app('🎁','Окончание','#e5b7ff','#a878ef','topic:e')}${app('📖','Полный разбор','#ffaaa2','#e65762','full')}${app('📚','Словарь','#ffd46b','#ec963c','dictionary')}${app('🎮','Тренировка','#c2b7ff','#8471ed','levels')}${app('🏆','Мои успехи','#ffd86c','#f39835','achievements')}${app('💡','Шпаргалка','#9fe5df','#46bfb5','cheat')}</div>`}
function pageTopic(){let x=PARTS[state.topic],example={p:WORDS.find(w=>w.w==='переход'),r:WORDS.find(w=>w.w==='лесной'),s:WORDS.find(w=>w.w==='лесник'),e:WORDS.find(w=>w.w==='школа')}[state.topic];return head(x.icon,x.name,'Узнай правило и потренируйся',x.color)+`<div class="card"><h3>📌 Что это такое?</h3><p>${x.what}</p></div><div class="card"><h3>🔍 Как найти?</h3>${x.how.map((t,i)=>`<div class="step"><div class="num">${i+1}</div><div>${esc(t)}</div></div>`).join('')}</div><div class="card"><h3>✏️ Пример</h3>${wordMarkup(example)}${legend(example)}<p class="note">${x.tip}</p></div><div style="margin:15px"><button class="btn wide" data-action="levels">🎮 Потренироваться</button></div>`}
function pageFull(){let w=WORDS.find(w=>w.w==='подводный');let steps=['Измени слово и найди окончание: подводный — подводная — подводное.','Отбрось окончание и найди основу слова.','Подбери родственные слова и выдели корень: вода, водный, подводный.','Найди часть перед корнем: под- — приставка.','Найди часть после корня, перед окончанием: -н- — суффикс.'];return head('📖','Разбор по составу','Пошаговая инструкция','#ff9fa2')+`<div class="card"><h3>В каком порядке разбирать?</h3>${steps.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div>${x}</div></div>`).join('')}</div><div class="card"><h3>Разберём слово «подводный»</h3>${wordMarkup(w)}${legend(w)}<p class="small">Основа — <b>подводн-</b>. Окончание — <b>-ый</b>. Корень — <b>-вод-</b>. Приставка — <b>под-</b>. Суффикс — <b>-н-</b>.</p></div><div class="card"><h3>⚠️ Важно помнить</h3><p>В слове может не быть приставки или суффикса. У изменяемого слова бывает нулевое окончание, а неизменяемые слова окончания не имеют.</p></div>`}
const LETTERS='А Б В Г Д Е Ё Ж З И Й К Л М Н О П Р С Т У Ф Х Ц Ч Ш Щ Э Ю Я'.split(' ');
function pageDictionary(){const query=state.search.trim().toLocaleLowerCase('ru');let filtered=WORDS.filter(w=>query?w.w.includes(query):w.w.toLocaleUpperCase('ru').startsWith(state.letter));return head('📚','Словарь','Слова по алфавиту и их состав','#ffcf68')+`<input id="dictsearch" class="search" placeholder="🔎 Найти слово…" value="${esc(state.search)}" aria-label="Поиск слова"/><div class="dictalpha">${LETTERS.map(l=>`<button class="letter ${l===state.letter&&!query?'active':''}" data-action="letter:${l}">${l}</button>`).join('')}</div><div class="banner">${query?'Результаты поиска':'Буква '+state.letter}: ${filtered.length} слов(а)</div>${filtered.length?`<div class="words">${filtered.map(w=>`<button class="wordbtn" data-action="word:${WORDS.indexOf(w)}">${esc(w.w)} ↗</button>`).join('')}</div>`:'<div class="empty">Здесь пока нет слов. Выбери другую букву или введи слово.</div>'}`}
function pageWord(){let w=state.word;return head('🔎',w.w,'Разбор слова по составу','#9ecaf8')+`<div class="card"><h3 class="cent">Состав слова</h3>${wordMarkup(w)}${legend(w)}</div><div class="card"><h3>📝 Подробный разбор</h3>${['p','r','s','e'].map(k=>`<div class="step"><span style="font-size:23px">${PARTS[k].icon}</span><div><b>${PARTS[k].name}:</b> ${w[k]?'<b>'+esc(w[k])+'</b>':k==='e'?'нулевое (□)':'нет'}</div></div>`).join('')}<p class="small">Основа: <strong>${esc(w.p+w.r+w.s)}</strong></p></div><div style="margin:15px"><button class="btn wide" data-action="dictionary">← Вернуться в словарь</button></div>`}
function pageLevels(){let defs=[['🌼','1 уровень','Корень и окончание','Простые слова','#d5f8bf'],['🏡','2 уровень','Приставка, корень, окончание','Три части слова','#c2e8fc'],['🏆','3 уровень','Смешанные слова','С приставками, суффиксами и без них','#f9cde3']];return head('🎮','Тренировка','Распредели буквы по частям слова','#c9b5ff')+`<div class="levels">${defs.map((v,i)=>`<button class="level" style="background:${v[4]}" data-action="start:${i+1}"><span class="emoji">${v[0]}</span><span><strong>${v[1]}</strong><small>${v[2]}</small><small>🏅 Рекорд: ${saved.best[i+1]||0}/${i===2?10:8}</small></span><span style="margin-left:auto;font-size:22px">›</span></button>`).join('')}</div>`}
function currentInfo(){const w=rounds[state.question];return w?{w,keys:['p','r','s','e'],answer:w.w}:null}

function preparePuzzle(){const info=currentInfo();if(!info)return;state.available=[...info.w.w].map(ch=>({id:++tileCounter,ch}));state.slots=Object.fromEntries(['p','r','s','e'].map(k=>[k,[]]));state.message='';state.helper='';state.selectedTile=null}

function startLevel(l){rounds=levelRounds(l);navigate('play',{level:l,question:0,step:0,mistakes:0,message:'',completed:false,slots:[],available:[],helper:''});preparePuzzle();render()}
function moveTileToSlot(id,part){if(!['p','r','s','e'].includes(part))return false;let tile=null;const bankIndex=state.available.findIndex(t=>t.id===id);if(bankIndex>=0){tile=state.available.splice(bankIndex,1)[0]}else{for(const k of ['p','r','s','e']){const i=state.slots[k].findIndex(t=>t.id===id);if(i>=0){tile=state.slots[k].splice(i,1)[0];break}}}if(!tile)return false;state.slots[part].push(tile);return true}
function moveTileToBank(id){for(const k of ['p','r','s','e']){const i=state.slots[k].findIndex(t=>t.id===id);if(i>=0){state.available.push(state.slots[k].splice(i,1)[0]);state.available.sort((a,b)=>a.id-b.id);return true}}return false}
function handleBankClick(id){state.selectedTile=id;render()}
function checkAnswer(){const info=currentInfo();if(!info)return;if(state.available.length){state.message='Перенеси все буквы в поля.';render();return}const wrong=['p','r','s','e'].some(k=>state.slots[k].map(t=>t.ch).join('')!==info.w[k]);if(wrong){state.mistakes++;state.message='Попробуй ещё! Проверь расположение букв.';render();return}state.question++;showToast('Правильно! 🌟');if(state.question>=rounds.length){const score=Math.max(1,3-Math.floor(state.mistakes/4));saved.stars+=score;saved.played++;saved.best[state.level]=Math.max(saved.best[state.level]||0,rounds.length-state.mistakes);persist();state.page='results';state.awarded=score;render();return}preparePuzzle();render()}

function resetPuzzle(){preparePuzzle();render()}

function pagePlay(){const info=currentInfo();if(!info)return pageResults();const w=info.w;const parts=['p','r','s','e'];const colors={p:'#fce7e2',r:'#ddf7e8',s:'#e0f1ff',e:'#f3e6ff'};const fields=parts.map(k=>{const tiles=state.slots[k]||[];return `<div class="morph-field" style="--field:${colors[k]}" data-part="${k}"><div class="field-label"><span class="mark-icon ${k}">${{p:'¬',r:'⌒',s:'⌃',e:'□'}[k]}</span><strong>${PARTS[k].name}</strong></div><div class="field-slots drop-slot ${state.selectedTile?'selectable':''}" data-part="${k}">${tiles.map(tile=>`<button class="dragTile in-slot" data-tile="${tile.id}" data-from="slot" aria-label="Буква ${esc(tile.ch)}, переместить">${esc(tile.ch)}</button>`).join('')}</div></div>`}).join('');return head('🎯','Уровень '+state.level,`Слово ${state.question+1} из ${rounds.length}`,'#9ce2ff')+`<div class="card exercise"><div class="bar"><div class="fill" style="width:${state.question/rounds.length*100}%"></div></div><div class="taskword">${esc(w.w)}</div><div class="morph-fields">${fields}</div><div class="bankwrap"><div class="banktitle">БУКВЫ СЛОВА</div><div class="letter-bank" id="bankArea">${state.available.map(tile=>`<button class="dragTile ${state.selectedTile===tile.id?'selected':''}" data-tile="${tile.id}" data-from="bank">${esc(tile.ch)}</button>`).join('')}</div></div>${state.message?`<div class="feedback bad">${esc(state.message)}</div>`:''}<div class="controls"><button class="btn secondary" data-action="resetpuzzle">↻</button><button class="btn" data-action="check">Проверить ✓</button></div></div>`}
function pageResults(){return head('🏆','Уровень пройден!','Ты справился отлично','#fee093')+`<div class="card cent"><div class="trophy">🏆</div><h2>Молодец!</h2><div class="star">${'⭐'.repeat(state.awarded||1)}</div><p>Разобрано слов: ${rounds.length}. Получено звёзд: ${state.awarded||1}.</p><p class="small">Ошибок: ${state.mistakes}.</p><button class="btn wide" data-action="start:${state.level}">🔄 Пройти ещё раз</button><div style="height:12px"></div><button class="btn secondary wide" data-action="levels">К выбору уровней</button></div>`}
function pageAchievements(){return head('🏆','Мои успехи','Твои достижения сохраняются','#ffe397')+`<div class="card cent"><div class="trophy">🌟</div><h2>${saved.stars} звёзд</h2><p>Всего пройдено тренировок: <b>${saved.played}</b></p></div>${[1,2,3].map(l=>`<div class="card"><h3>Уровень ${l} ${saved.best[l]>=(l===3?10:8)?'🥇':'✨'}</h3><div class="bar"><div class="fill" style="width:${Math.min(100,(saved.best[l]||0)/(l===3?10:8)*100)}%"></div></div><span class="small">Лучший результат: ${saved.best[l]||0}/${l===3?10:8}</span></div>`).join('')}`}
function pageCheat(){return head('💡','Шпаргалка','Повтори всё за минуту','#a0e9dd')+`<div class="card"><h3>🎓 Порядок разбора</h3>${['Измени слово и выдели окончание.','Найди основу (часть без окончания).','Подбери однокоренные слова и найди корень.','Найди приставку перед корнем.','Найди суффикс после корня.'].map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div>${s}</div></div>`).join('')}</div><div class="card"><h3>🖍 Цветные обозначения</h3>${wordMarkup(WORDS.find(w=>w.w==='подводный'))}${legend(WORDS.find(w=>w.w==='подводный'))}</div><div class="card"><h3>🧠 Как не ошибиться</h3><p class="small">Окончание ищем, когда изменяем форму слова. Корень ищем по родственным словам. Приставка стоит перед корнем, а суффикс обычно после него.</p></div>`}
function render(){let pages={home:pageHome,topic:pageTopic,full:pageFull,dictionary:pageDictionary,word:pageWord,levels:pageLevels,play:pagePlay,results:pageResults,achievements:pageAchievements,cheat:pageCheat};$('screen').innerHTML=(pages[state.page]||pageHome)();$('back').disabled=!trail.length;$('forward').disabled=!future.length;document.title=(state.page==='home'?'МорфоФон':$('screen').querySelector('h2')?.textContent||'МорфоФон')+' — МорфоФон';}
function handleAction(name,val){if(name==='topic')navigate('topic',{topic:val});else if(name==='start')startLevel(Number(val));else if(name==='letter'){state.letter=val;state.search='';render()}else if(name==='word')navigate('word',{word:WORDS[Number(val)]});else if(name==='resetpuzzle')resetPuzzle();else if(name==='check')checkAnswer();else navigate(name)}
$('screen').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const [name,val]=b.dataset.action.split(':');handleAction(name,val);return}const tile=e.target.closest('.dragTile');if(tile){const id=Number(tile.dataset.tile);if(tile.dataset.from==='bank')handleBankClick(id);else {state.selectedTile=id;render()}return}const field=e.target.closest('.drop-slot[data-part]');if(field&&state.selectedTile){moveTileToSlot(state.selectedTile,field.dataset.part);state.selectedTile=null;render()}});
$('screen').addEventListener('input',e=>{if(e.target.id==='dictsearch'){const pos=e.target.selectionStart;state.search=e.target.value;render();const field=$('dictsearch');field.focus();field.setSelectionRange(pos,pos)}});
function startDrag(el,clientX,clientY){const tileId=Number(el.dataset.tile);const origin=el.dataset.from;const rect=el.getBoundingClientRect();const ghost=el.cloneNode(true);ghost.classList.add('dragging-float');ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';ghost.style.left=clientX+'px';ghost.style.top=clientY+'px';document.body.appendChild(ghost);state.drag={tileId,origin,ghost,startX:clientX,startY:clientY}}
function moveDrag(clientX,clientY){if(!state.drag?.ghost)return;state.drag.ghost.style.left=clientX+'px';state.drag.ghost.style.top=clientY+'px';document.querySelectorAll('.drop-slot').forEach(s=>s.classList.remove('active'));const el=document.elementFromPoint(clientX,clientY)?.closest('.drop-slot');if(el)el.classList.add('active')}
function endDrag(clientX,clientY){if(!state.drag)return;const drag=state.drag;document.querySelectorAll('.drop-slot').forEach(s=>s.classList.remove('active'));const target=document.elementFromPoint(clientX,clientY);const slot=target?.closest('.drop-slot');const bank=target?.closest('#bankArea');if(slot){moveTileToSlot(drag.tileId,slot.dataset.part);render()}else if(bank&&drag.origin==='slot'){moveTileToBank(drag.tileId);render()}else if(Math.hypot(clientX-drag.startX,clientY-drag.startY)<9){if(drag.origin==='slot')moveTileToBank(drag.tileId);else handleBankClick(drag.tileId);render()}drag.ghost?.remove();state.drag=null}
$('screen').addEventListener('pointerdown',e=>{const tile=e.target.closest('.dragTile');if(!tile)return;e.preventDefault();startDrag(tile,e.clientX,e.clientY)});
window.addEventListener('pointermove',e=>{if(state.drag)moveDrag(e.clientX,e.clientY)});
window.addEventListener('pointerup',e=>{if(state.drag)endDrag(e.clientX,e.clientY)});
$('back').onclick=back;$('forward').onclick=forward;$('home').onclick=home;document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});
function tickClock(){const d=new Date();$('clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
tickClock();setInterval(tickClock,1000);render();
</script>
</body>
